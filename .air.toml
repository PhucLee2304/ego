root = "."
tmp_dir = "tmp/build"

[build]
  bin = "./tmp/build/main"
  entrypoint = ["./tmp/build/main"]
  cmd = "go build -buildvcs=false -o ./tmp/build/main ./services/${SERVICE:-identity}/cmd/server"
  delay = 1000
  exclude_dir = ["backups", "data", "logs", "tmp", "vendor", "services/knowledge/seed", "services/learning/seed"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  poll = true
  poll_interval = 500
  full_bin = "./tmp/build/main"
  include_dir = ["api/gen", "platform", "services"]
  include_ext = ["go", "tpl", "tmpl", "html", "json", "yaml", "yml"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true
