x-go-service: &go-service
  restart: unless-stopped
  networks:
    - ego-network
  healthcheck:
    test: ["CMD-SHELL", "netstat -an | grep 8080 || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 10s

services:
  docs:
    image: swaggerapi/swagger-ui:latest
    container_name: ego-docs
    restart: unless-stopped
    environment:
      URLS: >
        [
          { "url": "/identity/docs/doc.json", "name": "Identity" },
          { "url": "/storage/docs/doc.json", "name": "Storage" },
          { "url": "/topics/docs/doc.json", "name": "Topics" },
          { "url": "/exams/docs/doc.json", "name": "Exams" },
          { "url": "/classrooms/docs/doc.json", "name": "Classrooms" },
          { "url": "/notifications/docs/doc.json", "name": "Notifications" }
        ]
    networks:
      - ego-network

  nginx:
    image: nginx:alpine
    container_name: ego-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      identity:
        condition: service_healthy
      storage:
        condition: service_healthy
      topics:
        condition: service_healthy
      exams:
        condition: service_healthy
      classrooms:
        condition: service_healthy
      notifications:
        condition: service_healthy
      posts:
        condition: service_healthy
    networks:
      - ego-network

  identity:
    <<: *go-service
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    container_name: ego-identity
    env_file:
      - ./services/identity/.env
    volumes:
      - ./platform/credentials:/app/platform/credentials:ro
    depends_on:
      users-db:
        condition: service_healthy

  users-db:
    image: postgres:15.8-alpine
    container_name: ego-users-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
      POSTGRES_DB: ${USERS_DB_NAME}
    ports:
      - "${USERS_DB_PORT}:5432"
    volumes:
      - ./data/users-db:/var/lib/postgresql/data
    networks:
      - ego-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${USERS_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage:
    <<: *go-service
    build:
      context: .
      dockerfile: services/storage/Dockerfile
    container_name: ego-storage
    env_file:
      - ./services/storage/.env
    depends_on:
      identity:
        condition: service_healthy
      minio:
        condition: service_healthy

  minio:
    container_name: ego-minio
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: "0:0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --address ":9000" --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9102}:9000"
      - "${MINIO_CONSOLE_PORT:-9103}:9001"
    volumes:
      - ./data/minio:/data
    networks:
      - ego-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9000/minio/health/live >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  topics:
    <<: *go-service
    build:
      context: .
      dockerfile: services/topics/Dockerfile
      target: server
    container_name: ego-topics
    env_file:
      - ./services/topics/.env
    depends_on:
      topics-db:
        condition: service_healthy

  topics-seed:
    build:
      context: .
      dockerfile: services/topics/Dockerfile
      target: seed
    container_name: ego-topics-seed
    profiles:
      - seed
    env_file:
      - ./services/topics/.env
    volumes:
      - ./services/topics/seed:/app/services/topics/seed:ro
    depends_on:
      topics-db:
        condition: service_healthy
      storage:
        condition: service_healthy
    networks:
      - ego-network

  topics-db:
    image: postgres:15.8-alpine
    container_name: ego-topics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TOPICS_DB_USER}
      POSTGRES_PASSWORD: ${TOPICS_DB_PASSWORD}
      POSTGRES_DB: ${TOPICS_DB_NAME}
    ports:
      - "${TOPICS_DB_PORT}:5432"
    volumes:
      - ./data/topics-db:/var/lib/postgresql/data
    networks:
      - ego-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${TOPICS_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  exams:
    <<: *go-service
    container_name: ego-exams
    build:
      context: .
      dockerfile: services/exams/Dockerfile
      target: server
    env_file:
      - ./services/exams/.env
    depends_on:
      exams-db:
        condition: service_healthy
      identity:
        condition: service_healthy
      notifications:
        condition: service_healthy

  exams-seed:
    build:
      context: .
      dockerfile: services/exams/Dockerfile
      target: seed
    container_name: ego-exams-seed
    profiles:
      - seed
    env_file:
      - ./services/exams/.env
    volumes:
      - ./services/exams/seed:/app/services/exams/seed:ro
    depends_on:
      exams-db:
        condition: service_healthy
      storage:
        condition: service_healthy
      identity:
        condition: service_healthy
    networks:
      - ego-network

  exams-db:
    image: postgres:15.8-alpine
    container_name: ego-exams-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EXAMS_DB_USER}
      POSTGRES_PASSWORD: ${EXAMS_DB_PASSWORD}
      POSTGRES_DB: ${EXAMS_DB_NAME}
    ports:
      - "${EXAMS_DB_PORT}:5432"
    volumes:
      - ./data/exams-db:/var/lib/postgresql/data
    networks:
      - ego-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${EXAMS_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  classrooms:
    <<: *go-service
    container_name: ego-classrooms
    build:
      context: .
      dockerfile: services/classrooms/Dockerfile
      target: server
    env_file:
      - ./services/classrooms/.env
    environment:
      LIVEKIT_URL: ${LIVEKIT_INTERNAL_URL}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_JOIN_TOKEN_TTL: ${LIVEKIT_JOIN_TOKEN_TTL}
    depends_on:
      classrooms-db:
        condition: service_healthy
      identity:
        condition: service_healthy
      exams:
        condition: service_healthy
      notifications:
        condition: service_healthy
      livekit:
        condition: service_healthy

  classrooms-db:
    image: postgres:15.8-alpine
    container_name: ego-classrooms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CLASSROOMS_DB_USER}
      POSTGRES_PASSWORD: ${CLASSROOMS_DB_PASSWORD}
      POSTGRES_DB: ${CLASSROOMS_DB_NAME}
    ports:
      - "${CLASSROOMS_DB_PORT}:5432"
    volumes:
      - ./data/classrooms-db:/var/lib/postgresql/data
    networks:
      - ego-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${CLASSROOMS_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.9.10
    container_name: ego-livekit
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: ${LIVEKIT_PORT}
        bind_addresses:
          - "${LIVEKIT_BIND_ADDRESS}"
        rtc:
          tcp_port: ${LIVEKIT_RTC_TCP_PORT}
          port_range_start: ${LIVEKIT_RTC_PORT_RANGE_START}
          port_range_end: ${LIVEKIT_RTC_PORT_RANGE_END}
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - ${LIVEKIT_WEBHOOK_URL}
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    ports:
      - "${LIVEKIT_PORT}:${LIVEKIT_PORT}"
      - "${LIVEKIT_RTC_TCP_PORT}:${LIVEKIT_RTC_TCP_PORT}"
      - "${LIVEKIT_RTC_PORT_RANGE_START}-${LIVEKIT_RTC_PORT_RANGE_END}:${LIVEKIT_RTC_PORT_RANGE_START}-${LIVEKIT_RTC_PORT_RANGE_END}/udp"
    networks:
      - ego-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7880/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  notifications:
    <<: *go-service
    container_name: ego-notifications
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    env_file:
      - ./services/notifications/.env
    volumes:
      - ./platform/credentials:/app/platform/credentials:ro
    depends_on:
      notifications-db:
        condition: service_healthy
      identity:
        condition: service_healthy

  notifications-db:
    image: postgres:15.8-alpine
    container_name: ego-notifications-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NOTIFICATIONS_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD}
      POSTGRES_DB: ${NOTIFICATIONS_DB_NAME}
    ports:
      - "${NOTIFICATIONS_DB_PORT}:5432"
    volumes:
      - ./data/notifications-db:/var/lib/postgresql/data
    networks:
      - ego-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${NOTIFICATIONS_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  posts:
    <<: *go-service
    container_name: ego-posts
    build:
      context: .
      dockerfile: services/posts/Dockerfile
    env_file:
      - ./services/posts/.env
    depends_on:
      posts-db:
        condition: service_healthy
      identity:
        condition: service_healthy
      classrooms:
        condition: service_healthy
      notifications:
        condition: service_healthy
      storage:
        condition: service_healthy

  posts-db:
    image: postgres:15.8-alpine
    container_name: ego-posts-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTS_DB_USER}
      POSTGRES_PASSWORD: ${POSTS_DB_PASSWORD}
      POSTGRES_DB: ${POSTS_DB_NAME}
    ports:
      - "${POSTS_DB_PORT}:5432"
    volumes:
      - ./data/posts-db:/var/lib/postgresql/data
    networks:
      - ego-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTS_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  ego-network:
    driver: bridge
