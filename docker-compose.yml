x-go-service: &go-service
  restart: unless-stopped
  networks:
    - ego-network
  healthcheck:
    test: ["CMD-SHELL", "netstat -an | grep 8080 || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 10s

services:
  docs:
    image: swaggerapi/swagger-ui:latest
    container_name: docs
    restart: unless-stopped
    environment:
      URLS: >
        [
          { "url": "/auth/docs/doc.json", "name": "Auth" },
          { "url": "/users/docs/doc.json", "name": "Users" },
          { "url": "/storage/docs/doc.json", "name": "Storage" },
          { "url": "/topics/docs/doc.json", "name": "Topics" },
          { "url": "/exams/docs/doc.json", "name": "Exams" },
          { "url": "/classrooms/docs/doc.json", "name": "Classrooms" },
          { "url": "/notifications/docs/doc.json", "name": "Notifications" }
        ]
    networks:
      - ego-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      users:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
      topics:
        condition: service_healthy
      exams:
        condition: service_healthy
      classrooms:
        condition: service_healthy
      notifications:
        condition: service_healthy
      posts:
        condition: service_healthy
    networks:
      - ego-network

  users:
    <<: *go-service
    build:
      context: .
      dockerfile: services/users/Dockerfile
    container_name: users
    env_file:
      - ./services/users/.env
    depends_on:
      users-db:
        condition: service_healthy

  users-db:
    image: postgres:15.8-alpine
    container_name: users-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
      POSTGRES_DB: ${USERS_DB_NAME}
    ports:
      - "${USERS_DB_PORT}:5432"
    volumes:
      - ./data/users-db:/var/lib/postgresql/data
    networks:
      - ego-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${USERS_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    <<: *go-service
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: auth
    env_file:
      - ./services/auth/.env
    volumes:
      - ./platform/credentials:/app/platform/credentials:ro

  storage:
    <<: *go-service
    build:
      context: .
      dockerfile: services/storage/Dockerfile
    container_name: storage
    env_file:
      - ./services/storage/.env
    depends_on:
      auth:
        condition: service_healthy

  topics:
    <<: *go-service
    build:
      context: .
      dockerfile: services/topics/Dockerfile
      target: server
    container_name: topics
    env_file:
      - ./services/topics/.env
    depends_on:
      topics-db:
        condition: service_healthy

  topics-seed:
    build:
      context: .
      dockerfile: services/topics/Dockerfile
      target: seed
    container_name: topics-seed
    profiles:
      - seed
    env_file:
      - ./services/topics/.env
    volumes:
      - ./services/topics/seed:/app/services/topics/seed:ro
    depends_on:
      topics-db:
        condition: service_healthy
      storage:
        condition: service_healthy
    networks:
      - ego-network

  topics-db:
    image: postgres:15.8-alpine
    container_name: topics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TOPICS_DB_USER}
      POSTGRES_PASSWORD: ${TOPICS_DB_PASSWORD}
      POSTGRES_DB: ${TOPICS_DB_NAME}
    ports:
      - "${TOPICS_DB_PORT}:5432"
    volumes:
      - ./data/topics-db:/var/lib/postgresql/data
    networks:
      - ego-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${TOPICS_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  exams:
    <<: *go-service
    container_name: exams
    build:
      context: .
      dockerfile: services/exams/Dockerfile
      target: server
    env_file:
      - ./services/exams/.env
    depends_on:
      exams-db:
        condition: service_healthy
      auth:
        condition: service_healthy
      users:
        condition: service_healthy
      notifications:
        condition: service_healthy

  exams-seed:
    build:
      context: .
      dockerfile: services/exams/Dockerfile
      target: seed
    container_name: exams-seed
    profiles:
      - seed
    env_file:
      - ./services/exams/.env
    volumes:
      - ./services/exams/seed:/app/services/exams/seed:ro
    depends_on:
      exams-db:
        condition: service_healthy
      storage:
        condition: service_healthy
      auth:
        condition: service_healthy
    networks:
      - ego-network

  exams-db:
    image: postgres:15.8-alpine
    container_name: exams-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EXAMS_DB_USER}
      POSTGRES_PASSWORD: ${EXAMS_DB_PASSWORD}
      POSTGRES_DB: ${EXAMS_DB_NAME}
    ports:
      - "${EXAMS_DB_PORT}:5432"
    volumes:
      - ./data/exams-db:/var/lib/postgresql/data
    networks:
      - ego-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${EXAMS_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  classrooms:
    <<: *go-service
    container_name: classrooms
    build:
      context: .
      dockerfile: services/classrooms/Dockerfile
      target: server
    env_file:
      - ./services/classrooms/.env
    environment:
      LIVEKIT_URL: ${LIVEKIT_INTERNAL_URL}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    depends_on:
      classrooms-db:
        condition: service_healthy
      auth:
        condition: service_healthy
      users:
        condition: service_healthy
      exams:
        condition: service_healthy
      notifications:
        condition: service_healthy
      livekit:
        condition: service_healthy

  classrooms-db:
    image: postgres:15.8-alpine
    container_name: classrooms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CLASSROOMS_DB_USER}
      POSTGRES_PASSWORD: ${CLASSROOMS_DB_PASSWORD}
      POSTGRES_DB: ${CLASSROOMS_DB_NAME}
    ports:
      - "${CLASSROOMS_DB_PORT}:5432"
    volumes:
      - ./data/classrooms-db:/var/lib/postgresql/data
    networks:
      - ego-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${CLASSROOMS_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.9.10
    container_name: livekit
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: ${LIVEKIT_PORT}
        bind_addresses:
          - "${LIVEKIT_BIND_ADDRESS}"
        rtc:
          tcp_port: ${LIVEKIT_RTC_TCP_PORT}
          port_range_start: ${LIVEKIT_RTC_PORT_RANGE_START}
          port_range_end: ${LIVEKIT_RTC_PORT_RANGE_END}
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - ${LIVEKIT_WEBHOOK_URL}
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    ports:
      - "${LIVEKIT_PORT}:${LIVEKIT_PORT}"
      - "${LIVEKIT_RTC_TCP_PORT}:${LIVEKIT_RTC_TCP_PORT}"
      - "${LIVEKIT_RTC_PORT_RANGE_START}-${LIVEKIT_RTC_PORT_RANGE_END}:${LIVEKIT_RTC_PORT_RANGE_START}-${LIVEKIT_RTC_PORT_RANGE_END}/udp"
    networks:
      - ego-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7880/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  notifications:
    <<: *go-service
    container_name: notifications
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    env_file:
      - ./services/notifications/.env
    volumes:
      - ./platform/credentials:/app/platform/credentials:ro
    depends_on:
      notifications-db:
        condition: service_healthy
      auth:
        condition: service_healthy

  notifications-db:
    image: postgres:15.8-alpine
    container_name: notifications-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NOTIFICATIONS_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD}
      POSTGRES_DB: ${NOTIFICATIONS_DB_NAME}
    ports:
      - "${NOTIFICATIONS_DB_PORT}:5432"
    volumes:
      - ./data/notifications-db:/var/lib/postgresql/data
    networks:
      - ego-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${NOTIFICATIONS_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  posts:
    <<: *go-service
    container_name: posts
    build:
      context: .
      dockerfile: services/posts/Dockerfile
    env_file:
      - ./services/posts/.env
    depends_on:
      posts-db:
        condition: service_healthy
      auth:
        condition: service_healthy
      users:
        condition: service_healthy
      classrooms:
        condition: service_healthy
      notifications:
        condition: service_healthy

  posts-db:
    image: postgres:15.8-alpine
    container_name: posts-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTS_DB_USER}
      POSTGRES_PASSWORD: ${POSTS_DB_PASSWORD}
      POSTGRES_DB: ${POSTS_DB_NAME}
    ports:
      - "${POSTS_DB_PORT}:5432"
    volumes:
      - ./data/posts-db:/var/lib/postgresql/data
    networks:
      - ego-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTS_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  ego-network:
    driver: bridge
