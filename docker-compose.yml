x-go-service: &go-service
  restart: unless-stopped
  networks:
    - ego-network
  healthcheck:
    test: ["CMD-SHELL", "netstat -an | grep 8080 || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 10s

services:
  docs:
    image: swaggerapi/swagger-ui:latest
    container_name: ego-docs
    restart: unless-stopped
    environment:
      URLS: >
        [
          { "url": "/identity/docs/doc.json", "name": "Identity" },
          { "url": "/storage/docs/doc.json", "name": "Storage" },
          { "url": "/topics/docs/doc.json", "name": "Topics" },
          { "url": "/learning/docs/doc.json", "name": "Learning" },
          { "url": "/notifications/docs/doc.json", "name": "Notifications" }
          { "url": "/exams/docs/doc.json", "name": "Exams" },
          { "url": "/dictionary/docs/doc.json", "name": "Dictionary" },
          { "url": "/grammar/docs/doc.json", "name": "Grammar" }
        ]
    networks:
      - ego-network

  nginx:
    image: nginx:alpine
    container_name: ego-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - C:\Users\Admin\Desktop\AppTiengAnh\assets:/etc/nginx/assets:ro
    depends_on:
      identity:
        condition: service_healthy
      storage:
        condition: service_healthy
      topics:
        condition: service_healthy
      learning:
        condition: service_healthy
      notifications:
        condition: service_healthy
      posts:
        condition: service_healthy
      dictionary:
        condition: service_healthy
      grammar:
        condition: service_healthy
    networks:
      - ego-network

  identity:
    <<: *go-service
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    container_name: ego-identity
    env_file:
      - ./services/identity/.env
    volumes:
      - ./platform/credentials:/app/platform/credentials:ro
    depends_on:
      users-db:
        condition: service_healthy

  users-db:
    image: postgres:15.8-alpine
    container_name: ego-users-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
      POSTGRES_DB: ${USERS_DB_NAME}
    ports:
      - "${USERS_DB_PORT}:5432"
    volumes:
      - ./data/users-db:/var/lib/postgresql/data
    networks:
      - ego-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${USERS_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage:
    <<: *go-service
    build:
      context: .
      dockerfile: services/storage/Dockerfile
    container_name: ego-storage
    env_file:
      - ./services/storage/.env
    depends_on:
      identity:
        condition: service_healthy
      minio:
        condition: service_healthy

  minio:
    container_name: ego-minio
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: "0:0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --address ":9000" --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9102}:9000"
      - "${MINIO_CONSOLE_PORT:-9103}:9001"
    volumes:
      - ./data/minio:/data
    networks:
      - ego-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9000/minio/health/live >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  topics:
    <<: *go-service
    build:
      context: .
      dockerfile: services/topics/Dockerfile
      target: server
    container_name: ego-topics
    env_file:
      - ./services/topics/.env
    depends_on:
      topics-db:
        condition: service_healthy

  topics-seed:
    build:
      context: .
      dockerfile: services/topics/Dockerfile
      target: seed
    container_name: ego-topics-seed
    profiles:
      - seed
    env_file:
      - ./services/topics/.env
    volumes:
      - ./services/topics/seed:/app/services/topics/seed:ro
    depends_on:
      topics-db:
        condition: service_healthy
      storage:
        condition: service_healthy
    networks:
      - ego-network

  topics-db:
    image: postgres:15.8-alpine
    container_name: ego-topics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TOPICS_DB_USER}
      POSTGRES_PASSWORD: ${TOPICS_DB_PASSWORD}
      POSTGRES_DB: ${TOPICS_DB_NAME}
    ports:
      - "${TOPICS_DB_PORT}:5432"
    volumes:
      - ./data/topics-db:/var/lib/postgresql/data
    networks:
      - ego-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${TOPICS_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  learning:
    <<: *go-service
    container_name: ego-learning
    build:
      context: .
      dockerfile: services/learning/Dockerfile
      target: server
    env_file:
      - ./services/learning/.env
    environment:
      LIVEKIT_URL: ${LIVEKIT_INTERNAL_URL}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_JOIN_TOKEN_TTL: ${LIVEKIT_JOIN_TOKEN_TTL}
    depends_on:
      learning-db:
        condition: service_healthy
      identity:
        condition: service_healthy
      notifications:
        condition: service_healthy
      livekit:
        condition: service_healthy

  learning-seed:
    build:
      context: .
      dockerfile: services/learning/Dockerfile
      target: seed
    container_name: ego-learning-seed
    profiles:
      - seed
    env_file:
      - ./services/learning/.env
    volumes:
      - ./services/learning/seed:/app/services/learning/seed:ro
    depends_on:
      learning-db:
        condition: service_healthy
      storage:
        condition: service_healthy
    networks:
      - ego-network

  learning-db:
    image: postgres:15.8-alpine
    container_name: ego-learning-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LEARNING_DB_USER}
      POSTGRES_PASSWORD: ${LEARNING_DB_PASSWORD}
      POSTGRES_DB: ${LEARNING_DB_NAME}
    ports:
      - "${LEARNING_DB_PORT}:5432"
    volumes:
      - ./data/learning-db:/var/lib/postgresql/data
    networks:
      - ego-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${LEARNING_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.9.10
    container_name: ego-livekit
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: ${LIVEKIT_PORT}
        bind_addresses:
          - "${LIVEKIT_BIND_ADDRESS}"
        rtc:
          tcp_port: ${LIVEKIT_RTC_TCP_PORT}
          port_range_start: ${LIVEKIT_RTC_PORT_RANGE_START}
          port_range_end: ${LIVEKIT_RTC_PORT_RANGE_END}
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - ${LIVEKIT_WEBHOOK_URL}
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    ports:
      - "${LIVEKIT_PORT}:${LIVEKIT_PORT}"
      - "${LIVEKIT_RTC_TCP_PORT}:${LIVEKIT_RTC_TCP_PORT}"
      - "${LIVEKIT_RTC_PORT_RANGE_START}-${LIVEKIT_RTC_PORT_RANGE_END}:${LIVEKIT_RTC_PORT_RANGE_START}-${LIVEKIT_RTC_PORT_RANGE_END}/udp"
    networks:
      - ego-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7880/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  notifications:
    <<: *go-service
    container_name: ego-notifications
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    env_file:
      - ./services/notifications/.env
    volumes:
      - ./platform/credentials:/app/platform/credentials:ro
    depends_on:
      notifications-db:
        condition: service_healthy
      identity:
        condition: service_healthy

  notifications-db:
    image: postgres:15.8-alpine
    container_name: ego-notifications-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NOTIFICATIONS_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD}
      POSTGRES_DB: ${NOTIFICATIONS_DB_NAME}
    ports:
      - "${NOTIFICATIONS_DB_PORT}:5432"
    volumes:
      - ./data/notifications-db:/var/lib/postgresql/data
    networks:
      - ego-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${NOTIFICATIONS_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  posts:
    <<: *go-service
    container_name: ego-posts
    build:
      context: .
      dockerfile: services/posts/Dockerfile
    env_file:
      - ./services/posts/.env
    depends_on:
      posts-db:
        condition: service_healthy
      identity:
        condition: service_healthy
      learning:
        condition: service_healthy
      notifications:
        condition: service_healthy
      storage:
        condition: service_healthy

  posts-db:
    image: postgres:15.8-alpine
    container_name: ego-posts-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTS_DB_USER}
      POSTGRES_PASSWORD: ${POSTS_DB_PASSWORD}
      POSTGRES_DB: ${POSTS_DB_NAME}
    ports:
      - "${POSTS_DB_PORT}:5432"
    volumes:
      - ./data/posts-db:/var/lib/postgresql/data
    networks:
      - ego-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTS_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  dictionary:
    <<: *go-service
    build:
      context: .
      dockerfile: services/dictionary/Dockerfile
      target: server
    container_name: dictionary
    env_file:
      - ./services/dictionary/.env
    volumes:
      - C:\Users\Admin\Desktop\AppTiengAnh\assets:/app/assets:ro
    depends_on:
      dictionary-db:
        condition: service_healthy
      auth:
        condition: service_healthy

  dictionary-seed:
    build:
      context: .
      dockerfile: services/dictionary/Dockerfile
      target: seed
    container_name: dictionary-seed
    profiles:
      - seed
    env_file:
      - ./services/dictionary/.env
    volumes:
      - C:\Users\Admin\Desktop\AppTiengAnh\assets:/app/assets:ro
      - C:\Users\Admin\Desktop\AppTiengAnh:/app/services/dictionary/cmd/seed:ro
    depends_on:
      dictionary-db:
        condition: service_healthy
    networks:
      - ego-network

  dictionary-db:
    image: postgres:15.8-alpine
    container_name: dictionary-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DICTIONARY_DB_USER}
      POSTGRES_PASSWORD: ${DICTIONARY_DB_PASSWORD}
      POSTGRES_DB: ${DICTIONARY_DB_NAME}
    ports:
      - "${DICTIONARY_DB_PORT}:5432"
    volumes:
      - ./data/dictionary-db:/var/lib/postgresql/data
    networks:
      - ego-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DICTIONARY_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  grammar:
    <<: *go-service
    build:
      context: .
      dockerfile: services/grammar/Dockerfile
      target: server
    container_name: grammar
    env_file:
      - ./services/grammar/.env
    depends_on:
      grammar-db:
        condition: service_healthy
      auth:
        condition: service_healthy

  grammar-seed:
    build:
      context: .
      dockerfile: services/grammar/Dockerfile
      target: seed
    container_name: grammar-seed
    profiles:
      - seed
    env_file:
      - ./services/grammar/.env
    volumes:
      - C:\Users\Admin\NguPhapTiengAnh:/app/services/grammar/cmd/seed:ro
    depends_on:
      grammar-db:
        condition: service_healthy
    networks:
      - ego-network

  grammar-db:
    image: postgres:15.8-alpine
    container_name: grammar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GRAMMAR_DB_USER}
      POSTGRES_PASSWORD: ${GRAMMAR_DB_PASSWORD}
      POSTGRES_DB: ${GRAMMAR_DB_NAME}
    ports:
      - "${GRAMMAR_DB_PORT}:5432"
    volumes:
      - ./data/grammar-db:/var/lib/postgresql/data
    networks:
      - ego-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${GRAMMAR_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  ego-network:
    driver: bridge
