syntax = "proto3";

package users;

option go_package = "ego/api/gen/go/users";

import "google/api/annotations.proto";

service UserService {
  rpc UpsertUser(UpsertUserRequest) returns (UpsertUserResponse) {
    option (google.api.http) = {
      post: "/v1/users/upsert"
      body: "*"
    };
  }

  rpc GetUserRole(GetUserRoleRequest) returns (GetUserRoleResponse);
  rpc GetUsersInfo(GetUsersInfoRequest) returns (GetUsersInfoResponse);
}

message UpsertUserRequest {
    string email = 1;
    string name = 2;
    string avatar = 3;
}

message UpsertUserResponse {
    string id = 1;
}

message GetUserRoleRequest {
    string id = 1;
}

message GetUserRoleResponse {
    string role = 1;
}

message GetUsersInfoRequest {
    repeated string ids = 1;
}

message UserInfo {
    string id = 1;
    string email = 2;
    string name = 3;
    string avatar = 4;
}

message GetUsersInfoResponse {
    repeated UserInfo users = 1;
}
