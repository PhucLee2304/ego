syntax = "proto3";

package storage;

option go_package = "ego/api/gen/go/storage";

import "google/api/annotations.proto";

service StorageService {
  rpc GeneratePresignedUploadURL(GeneratePresignedUploadURLRequest)
    returns (GeneratePresignedUploadURLResponse) {
    option (google.api.http) = {
      post: "/v1/storage/presign/upload"
      body: "*"
    };
  }

  rpc GetPublicURL(GetPublicURLRequest)
    returns (GetPublicURLResponse) {
    option (google.api.http) = {
      get: "/v1/storage/url"
    };
  }

  rpc DeleteFolder(DeleteFolderRequest)
    returns (DeleteFolderResponse) {
    option (google.api.http) = {
      delete: "/v1/storage/folder/{folder}"
    };
  }

  rpc GetObjectMetadata(GetObjectMetadataRequest) returns (GetObjectMetadataResponse);
  rpc DeleteObject(DeleteObjectRequest) returns (DeleteObjectResponse);
}

message GeneratePresignedUploadURLRequest {
  repeated string folders = 1;
  string file_name = 2;
  string content_type = 3;
  // true: ký URL theo host nội bộ (R2_HOST, vd http://minio:9000) để caller
  // trong mạng docker (seed) upload thẳng vào MinIO, không đi qua domain public.
  bool internal = 4;
}

message GeneratePresignedUploadURLResponse {
  string url = 1;
}

message GetPublicURLRequest {
  repeated string folders = 1;
  string file_name = 2;
}

message GetPublicURLResponse {
  string url = 1;
}

message DeleteFolderRequest {
  string folder = 1;
}

message DeleteFolderResponse {
  uint32 deleted_count = 1;
}

message GetObjectMetadataRequest {
  repeated string folders = 1;
  string file_name = 2;
}

message GetObjectMetadataResponse {
  int64 size = 1;
  string content_type = 2;
}

message DeleteObjectRequest {
  repeated string folders = 1;
  string file_name = 2;
}

message DeleteObjectResponse {}
