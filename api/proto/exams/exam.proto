syntax = "proto3";

package exams;

option go_package = "ego/api/gen/go/exams";

service ExamService {
  rpc CreatePrivateExam(CreatePrivateExamRequest) returns (CreatePrivateExamResponse);
  rpc DeletePrivateExamRollback(DeletePrivateExamRollbackRequest) returns (DeletePrivateExamRollbackResponse);
  rpc SubmitAssignmentAttempts(SubmitAssignmentAttemptsRequest) returns (SubmitAssignmentAttemptsResponse);
  rpc GetAssignmentAttemptState(GetAssignmentAttemptStateRequest) returns (GetAssignmentAttemptStateResponse);
  rpc UpdateAssignmentAttemptSchedule(UpdateAssignmentAttemptScheduleRequest) returns (UpdateAssignmentAttemptScheduleResponse);
  rpc GetPrivateExam(GetPrivateExamRequest) returns (PrivateExamResponse);
  rpc UpdatePrivateExam(UpdatePrivateExamRequest) returns (PrivateExamResponse);
  rpc ResetAssignmentAttempt(ResetAssignmentAttemptRequest) returns (ResetAssignmentAttemptResponse);
  rpc ReconcileAssignmentSubmissions(ReconcileAssignmentSubmissionsRequest) returns (ReconcileAssignmentSubmissionsResponse);
  rpc SubmitStudentAssignmentAttempts(SubmitStudentAssignmentAttemptsRequest) returns (SubmitStudentAssignmentAttemptsResponse);
  rpc GetExamAudits(GetExamAuditsRequest) returns (GetExamAuditsResponse);
}

message CreatePrivateExamRequest {
  string title = 1;
  optional string description = 2;
  repeated CreatePrivateExamQuestion questions = 3;
}

message CreatePrivateExamQuestion {
  string content = 1;
  optional string explanation = 2;
  reserved 3;
  repeated string options = 4;
  int32 correct_option_index = 5;
}

message CreatePrivateExamResponse {
  uint64 id = 1;
  string title = 2;
  optional string description = 3;
  string type = 4;
  bool is_public = 5;
}

message DeletePrivateExamRollbackRequest {
  uint64 id = 1;
}

message DeletePrivateExamRollbackResponse {
  bool deleted = 1;
}

message SubmitAssignmentAttemptsRequest {
  uint64 assignment_id = 1;
}

message SubmitAssignmentAttemptsResponse {
  int32 submitted_count = 1;
}

message GetAssignmentAttemptStateRequest { uint64 assignment_id = 1; }
message GetAssignmentAttemptStateResponse {
  int64 active_count = 1;
  int64 total_count = 2;
}

message UpdateAssignmentAttemptScheduleRequest {
  uint64 assignment_id = 1;
  int32 duration_minutes = 2;
  int64 due_at_unix = 3;
}
message UpdateAssignmentAttemptScheduleResponse { int64 updated_count = 1; }

message PrivateExamQuestion {
  string content = 1;
  optional string explanation = 2;
  repeated string options = 3;
  int32 correct_option_index = 4;
  bool excluded_from_score = 5;
  uint64 id = 6;
  repeated uint64 option_ids = 7;
}

message GetPrivateExamRequest { uint64 id = 1; }
message UpdatePrivateExamRequest {
  uint64 id = 1;
  string title = 2;
  optional string description = 3;
  repeated PrivateExamQuestion questions = 4;
  bool correction_only = 5;
  string actor_id = 6;
  string reason = 7;
}
message ResetAssignmentAttemptRequest { uint64 assignment_id = 1; string student_id = 2; }
message ResetAssignmentAttemptResponse { bool reset = 1; }
message ReconcileAssignmentSubmissionsRequest { uint64 assignment_id = 1; }
message ReconcileAssignmentSubmissionsResponse { int32 enqueued_count = 1; }
message SubmitStudentAssignmentAttemptsRequest {
  string student_id = 1;
  repeated uint64 assignment_ids = 2;
}
message SubmitStudentAssignmentAttemptsResponse { int32 submitted_count = 1; }
message GetExamAuditsRequest { uint64 exam_id = 1; }
message ExamAuditScoreChange {
  uint64 attempt_id = 1;
  string student_id = 2;
  optional double before_score = 3;
  optional double after_score = 4;
}
message ExamAuditResponse {
  uint64 id = 1;
  uint64 exam_id = 2;
  string actor_id = 3;
  string reason = 4;
  bytes before = 5;
  bytes after = 6;
  optional int64 regraded_at_unix = 7;
  int64 created_at_unix = 8;
  repeated ExamAuditScoreChange score_changes = 9;
}
message GetExamAuditsResponse { repeated ExamAuditResponse audits = 1; }
message PrivateExamResponse {
  uint64 id = 1;
  string title = 2;
  optional string description = 3;
  repeated PrivateExamQuestion questions = 4;
}
