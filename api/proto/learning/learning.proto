syntax = "proto3";

package learning;

option go_package = "ego/api/gen/go/learning";

service LearningService {
  rpc GetClassroomPostAccess(GetClassroomPostAccessRequest)
      returns (GetClassroomPostAccessResponse);
  rpc RemoveUserFromLiveRooms(RemoveUserFromLiveRoomsRequest)
      returns (RemoveUserFromLiveRoomsResponse);
}

message GetClassroomPostAccessRequest {
  uint64 classroom_id = 1;
  string user_id = 2;
}

message GetClassroomPostAccessResponse {
  uint64 classroom_id = 1;
  string classroom_name = 2;
  string teacher_id = 3;
  bool active = 4;
  bool is_teacher = 5;
  bool is_approved_member = 6;
  repeated string approved_student_ids = 7;
}

message RemoveUserFromLiveRoomsRequest {
  string user_id = 1;
}

message RemoveUserFromLiveRoomsResponse {
  uint32 removed_count = 1;
  uint32 ended_count = 2;
}
